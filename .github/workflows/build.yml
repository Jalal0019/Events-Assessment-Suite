name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --windowed --name "UoBIndicoSuite" --icon "assets/uob_logo.ico" --add-data "assets;assets" uob_indico_suite.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: UoBIndicoSuite-exe
          path: dist/UoBIndicoSuite.exe
